<!DOCTYPE html>
<html>
<head>
    <title>Meghu Website</title>

    <style>
        body {
            background-color: lightpink;
            text-align: center;
            font-family: Arial;
        }

        .container {
            background-color: white;
            width: 80%;
            margin: 50px auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            color: purple;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        button {
            background-color: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to Meghu Website 💜</h1>

        <p>This is my first website ✨</p>

        <button onclick="sayHello()">Click Me 👋</button>
    </div>

    <script>
        function sayHello() {
            alert("Hello Meghu! 👋✨");
        }
    </script>

</body>
</html>
