<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meghu Website 💜</title>

<style>

* {
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e7, #e8d5ff);
    color: #333;
    transition: 0.4s;
}

/* NAVIGATION */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: purple;
    padding: 15px 5px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin: 5px 7px;
    display: inline-block;
}

nav a:hover {
    color: #ffd6e7;
}

/* MAIN */

.container {
    width: 90%;
    max-width: 700px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 10px 30px gray;
}

section {
    margin-top: 45px;
}

/* HOME */

.profile {
    width: 230px;
    max-width: 90%;
    border-radius: 50%;
    border: 5px solid purple;
    box-shadow: 0 8px 25px gray;
    transition: 0.4s;
}

.profile:hover {
    transform: scale(1.05);
}

h1 {
    color: purple;
    font-size: 34px;
}

h2 {
    color: #d63384;
}

p {
    font-size: 17px;
    line-height: 1.7;
}

/* CARD */

.card {
    background: #fff0f7;
    padding: 20px;
    margin-top: 15px;
    border-radius: 20px;
}

/* GALLERY */

.gallery {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
}

.gallery img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 20px;
    border: 3px solid purple;
    box-shadow: 0 5px 15px gray;
    transition: 0.4s;
}

.gallery img:hover {
    transform: scale(1.07);
}

/* SKILLS */

.skills {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.skill {
    background: #f1d5ff;
    color: purple;
    padding: 12px 18px;
    border-radius: 20px;
    font-weight: bold;
}

/* BUTTON */

button {
    background: purple;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    margin: 8px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
}

/* BIRTHDAY */

.birthday {
    background: #fff0f7;
    padding: 25px;
    border-radius: 25px;
}

/* SOCIAL */

.social a {
    display: inline-block;
    background: #d63384;
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 12px;
    margin: 5px;
}

/* FORM */

input,
textarea {
    width: 90%;
    padding: 12px;
    margin: 8px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    height: 100px;
}

/* GUESTBOOK */

.guestbook-message {
    background: white;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    text-align: left;
}

/* LOGIN */

.login-box {
    background: #f5e8ff;
    padding: 20px;
    border-radius: 20px;
}

/* DARK MODE */

body.dark {
    background: linear-gradient(135deg, #17101c, #30203b);
    color: white;
}

body.dark .container {
    background: #241b29;
}

body.dark .card,
body.dark .birthday,
body.dark .login-box {
    background: #35263c;
}

body.dark p {
    color: #ddd;
}

#topButton {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: none;
    border-radius: 50%;
    width: 50px;
